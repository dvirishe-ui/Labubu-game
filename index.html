<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b1d3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Labubu: Blind Box Run &amp; Collect</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='48' rx='8' fill='%23ff8fb1' stroke='%233d2a52' stroke-width='4'/%3E%3Ctext x='32' y='47' font-size='34' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23fff'%3E%3F%3C/text%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2b1d3a;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        touch-action: none;
      }
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffe9c7;
        font: 600 18px system-ui, sans-serif;
        pointer-events: none;
      }
      /* Upright phones: ask the player to rotate (the runner is a landscape game). */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(circle at 50% 40%, #5a3a7a, #2b1d3a 70%);
        color: #fff4e6;
        font: 700 22px 'Trebuchet MS', Verdana, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      #rotate-hint .phone {
        width: 70px;
        height: 120px;
        border: 6px solid #fff4e6;
        border-radius: 16px;
        position: relative;
        animation: tilt 1.8s ease-in-out infinite;
      }
      #rotate-hint .phone::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 8px;
        width: 14px;
        height: 14px;
        margin-left: -7px;
        border-radius: 50%;
        background: #ff8fb1;
      }
      #rotate-hint small {
        font-size: 16px;
        opacity: 0.8;
      }
      @keyframes tilt {
        0%, 20% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-fallback">Opening the blind box…</div>
    <div id="game"></div>
    <div id="rotate-hint">
      <div class="phone"></div>
      <div>Turn your phone sideways to play</div>
      <small>Labubu runs best in landscape, full screen</small>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
